apiVersion: v2
name: kubevirt-csi
description: >-
  The tenant side of the KubeVirt CSI driver for a cluster whose nodes are KubeVirt VMs:
  the node plugin and a StorageClass whose volumes are DataVolumes of the infrastructure
  cluster, hotplugged into the node VMs. The controller runs in the infrastructure
  cluster (chart kubevirt-csi-hub).
type: application
# The published version and appVersion are set when the chart is published:
# 0.0.0-dev/dev for the dev channel, X.Y.Z/vX.Y.Z for a release.
version: 0.0.0-dev
appVersion: dev
kubeVersion: ">=1.24.0-0"
home: https://github.com/petasus-ai/kubevirt-csi-driver
sources:
  - https://github.com/petasus-ai/kubevirt-csi-driver
  - https://github.com/kubevirt/csi-driver
